[AccessTransformers]
; All private game members used by NodeUpgrade go through FNodeUpgradeGameAccess (Source/NodeUpgrade/Private/NodeUpgradeGameAccess.cpp).
; Every symbol below was checked against the CL502094 headers and the exports of FactoryGameSteam-FactoryGame-Win64-Shipping.dll.

; Recompute the cached cycle time of miners / oil extractors / fracking extractors after a purity change (private CalculateProductionCycleTime).
Friend=(Class="AFGBuildableResourceExtractor", FriendClass="FNodeUpgradeGameAccess")

; Refresh the total shown by the Resource Well Pressurizer (private CalculateDefaultPotentialExtractionPerMinute).
Friend=(Class="AFGBuildableFrackingActivator", FriendClass="FNodeUpgradeGameAccess")

; Find the geyser of a geothermal generator and recompute its power range (private mExtractableResource, OnExtractableResourceSet).
Friend=(Class="AFGBuildableGeneratorGeoThermal", FriendClass="FNodeUpgradeGameAccess")
